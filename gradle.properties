# Maven Central (Sonatype Central Portal) publishing config for the Android SDK,
# consumed by the com.vanniktech.maven.publish plugin. Copied to the repo root as
# gradle.properties during assembly. Credentials + signing key are injected at
# publish time via ORG_GRADLE_PROJECT_* env vars in the CI workflow.
GROUP=com.lockally
POM_ARTIFACT_ID=lockally-android
VERSION_NAME=0.1.0

POM_NAME=Lockally Android SDK
POM_DESCRIPTION=Official Lockally SDK for Android/Kotlin — transactional email, contacts, and agent inboxes.
POM_URL=https://github.com/lockallyinc/lockally-android

POM_LICENSE_NAME=MIT
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo

POM_DEVELOPER_ID=lockally
POM_DEVELOPER_NAME=Lockally
POM_DEVELOPER_URL=https://lockally.com

POM_SCM_URL=https://github.com/lockallyinc/lockally-android
POM_SCM_CONNECTION=scm:git:git://github.com/lockallyinc/lockally-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/lockallyinc/lockally-android.git

# Publish to the Central Portal and auto-release once validation passes.
SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=true
RELEASE_SIGNING_ENABLED=true
